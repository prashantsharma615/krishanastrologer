<style>
:root{--bg:#0f0b24;--card:#1a1438;--card2:#231b4a;--gold:#e8b94a;--gold2:#f6d98b;--txt:#ece8fb;--mut:#a59fc7;--line:#3a3070;--good:#7fd8a6;--bad:#f2908b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans Devanagari",system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -200px,#2c1f6b 0%,var(--bg) 60%);color:var(--txt);min-height:100vh}
body.hi{font-family:"Noto Sans Devanagari",Inter,system-ui,sans-serif}
header{text-align:center;padding:22px 16px 8px;position:relative}
.lang{display:inline-flex;border:1px solid var(--gold);border-radius:999px;overflow:hidden;margin-bottom:14px}
.lang button{background:transparent;color:var(--gold2);border:0;border-radius:0;padding:7px 16px;font-size:14px;font-weight:600}
.lang button.on{background:var(--gold);color:#1b1230}
.logo{font-family:Cinzel,"Noto Sans Devanagari",serif;font-size:30px;letter-spacing:2px;color:var(--gold)}
body.hi .logo{letter-spacing:0}
.logo span{color:var(--txt)}
.tag{color:var(--mut);font-size:14px;margin-top:4px}
main{max-width:980px;margin:0 auto;padding:12px 16px 60px}
.card{background:linear-gradient(180deg,var(--card),#150f30);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0}
h2{font-family:Cinzel,"Noto Sans Devanagari",serif;color:var(--gold2);font-size:19px;margin:0 0 14px;letter-spacing:.5px}
h3{color:var(--gold2);font-size:15px;margin:16px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}
input,select,textarea{width:100%;background:#0e0a22;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px;font:inherit;font-size:15px}
input:focus,select:focus{outline:none;border-color:var(--gold)}
button{background:linear-gradient(180deg,#f2c75c,#d49b25);color:#1b1230;border:0;border-radius:10px;padding:12px 22px;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}
button.ghost{background:transparent;color:var(--gold2);border:1px solid var(--gold)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.hidden{display:none}
.two{display:grid;grid-template-columns:minmax(280px,400px) 1fr;gap:20px;align-items:start}
@media(max-width:760px){.two{grid-template-columns:1fr}}
svg.chart{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--card2);border:1px solid var(--line);margin:2px 4px 2px 0}
.pill.g{color:var(--good);border-color:#2f6b4c}.pill.b{color:var(--bad);border-color:#7a3a37}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--card2);color:var(--txt);border:1px solid var(--line);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:500}
.tab.on{background:var(--gold);color:#1b1230;border-color:var(--gold)}
.reading p{line-height:1.7;margin:8px 0;color:#ddd8f3}
.reading ul{margin:6px 0 6px 18px;line-height:1.65;color:#ddd8f3}
.kv{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.kv div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:130px}
.kv b{display:block;color:var(--gold2);font-size:16px;margin-top:2px}
.kv small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.sub{color:var(--mut);font-size:12px}
.note{font-size:12px;color:var(--mut);line-height:1.6;text-align:center;margin-top:24px}
.dasha-now{background:#2a1f57}
.tsel{display:flex;gap:6px}.tsel select{padding:11px 6px}
.qbox{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px}
.step{display:flex;gap:10px;align-items:baseline}.step .n{background:var(--gold);color:#1b1230;border-radius:999px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.mantra{color:var(--gold2);font-weight:600}
.nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.nav button{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.nav button.on{background:var(--gold);color:#1b1230;border-color:var(--gold)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:16px}
.rbtn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:500}
.rbtn.on{border-color:var(--gold);background:#3a2c74}
.sym{font-size:22px;color:var(--gold2)}.you{font-size:10px;color:var(--good)}
.stars{color:var(--gold);font-size:20px;letter-spacing:2px}
.score{display:flex;gap:18px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.big{font-family:Cinzel,serif;font-size:48px;color:var(--gold);line-height:1}.big span{font-size:18px;color:var(--mut)}
.dosh{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}.dosh:last-child{border:0}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:90%;padding:10px 14px;border-radius:14px;line-height:1.65;font-size:15px}
.msg.u{align-self:flex-end;background:var(--gold);color:#1b1230;border-bottom-right-radius:4px;font-weight:500}
.msg.b{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.b p{margin:6px 0}.msg.b ul{margin:4px 0 4px 18px}
.msg details summary{cursor:pointer;color:var(--gold2);margin-top:8px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500}
.toprow{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toprow .lang{margin-bottom:0}
button.install{padding:7px 14px;font-size:14px;border-radius:999px}
.ah{color:var(--gold2);font-size:15px;margin:14px 0 4px}
.reading ul,.msg.b ul{margin:4px 0 4px 18px}
.hl{background:#3a2c74;border-left:3px solid var(--gold);padding:8px 10px;border-radius:8px}
.pro{background:#2b2350;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.src{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--gold2)}
details.why summary{cursor:pointer;color:var(--gold2);font-weight:600;font-size:14px;margin-top:6px}
details.why ol{margin:8px 0 0 18px;font-size:13px;line-height:1.55;color:#cfc9ea}details.why li{margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(5,3,15,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.hidden{display:none}.modal .im-body{background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:20px;max-width:440px;width:100%}
.modal ol{line-height:1.7;margin:10px 0 10px 18px}.modal .ico{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px}
.im-plat{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mut)}
.owner{display:flex;align-items:center;gap:16px;max-width:980px;margin:16px auto 0}
.owner img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0}
.owner .sub{text-transform:uppercase;letter-spacing:.6px;font-size:11px}.oname{font-family:Cinzel,"Noto Sans Devanagari",serif;font-size:22px;color:var(--gold2)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.fm{font-weight:600;font-size:14px;margin-bottom:2px}.fcard .stars{font-size:16px}
.flist{display:flex;flex-direction:column;gap:8px}.fyear{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.6;font-size:14px}
.banner{background:#3a2c74;border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}

<body>
<header>
  <div class="toprow"><div class="lang"><button data-lang="en">English</button><button data-lang="hi">हिंदी</button></div><button class="ghost install" id="installBtn" data-i="install"></button></div>
  <div class="logo" data-i="logo"></div>
  <div class="tag" data-i="tagline"></div>
  <nav class="nav"><button data-view="home" data-i="navHome"></button><button data-view="ask" data-i="navAsk"></button><button data-view="future" data-i="navFuture"></button><button data-view="match" data-i="navMatch"></button><button data-view="daily" data-i="navDaily"></button><button data-view="dosh" data-i="navDosh"></button></nav>
</header>
<main>
<div id="view-home" class="view">
<section class="card" id="formCard">
  <div class="banner hidden" id="doshNeed" data-i="doshNeed"></div>
  <h2 data-i="enterDetails"></h2>
  <div class="grid">
    <div><label data-i="fullName"></label><input id="name" data-ph="namePh"></div>
    <div><label data-i="gender"></label><select id="gender"></select></div>
    <div><label data-i="dob"></label><input id="dob" type="date" value="1995-07-22"></div>
    <div><label data-i="tob"></label><div class="tsel"><select id="hh"></select><select id="mm"></select><select id="ap"></select></div></div>
    <div><label data-i="pob"></label><select id="city"></select></div>
  </div>
  <p class="tag" style="text-align:left;margin:8px 0 0" data-i="timeHint"></p>
  <div class="grid hidden" id="customBox" style="margin-top:12px">
    <div><label data-i="lat"></label><input id="lat" type="number" step="0.0001" value="32.7266"></div>
    <div><label data-i="lon"></label><input id="lon" type="number" step="0.0001" value="74.8570"></div>
    <div><label data-i="tz"></label><input id="tz" type="number" step="0.25" value="5.5"></div>
  </div>
  <h2 style="margin-top:24px" data-i="probHead"></h2>
  <div><label data-i="chooseProb"></label><select id="probSel"></select></div>
  <div style="margin-top:12px"><label data-i="describe"></label><input id="probTxt" data-ph="askPh"></div>
  <div class="row"><button id="go" data-i="generate"></button><span class="tag" style="margin:0" data-i="exactTime"></span></div>
</section>

<div id="result" class="hidden">
  <section class="card">
    <h2 data-i="solve"></h2>
    <div class="reading" id="reading"></div>
    <h3 style="margin-top:22px" data-i="another"></h3>
    <div class="tabs" id="tabs"></div>
    <div class="row" style="margin-top:0;margin-bottom:4px">
      <input id="ask" data-ph="askPh" style="flex:1;min-width:220px">
      <button class="ghost" id="askBtn" data-i="getGuidance"></button>
    </div>
  </section>

  <section class="card">
    <h2 id="hello"></h2>
    <div class="kv" id="summary"></div>
    <div class="two" style="margin-top:14px">
      <div><svg class="chart" id="chart" viewBox="0 0 400 400"></svg><div class="tag" style="text-align:center" data-i="chartCap"></div></div>
      <div><table id="ptable"></table></div>
    </div>
  </section>

  <section class="card" id="doshCard">
    <h2 data-i="doshTitle"></h2>
    <div class="reading" id="dosh"></div>
  </section>

  <section class="card">
    <h2 data-i="dashaTitle"></h2>
    <p class="tag" style="text-align:left;margin:0 0 10px" data-i="dashaDesc"></p>
    <table id="dtable"></table>
    <h3 data-i="antarTitle"></h3>
    <table id="atable"></table>
  </section>

  <div class="row" style="justify-content:center"><button class="ghost" id="again" data-i="newKundli"></button></div>
</div>
</div>

<div id="view-ask" class="view hidden">
<section class="card">
  <h2 data-i="askTitle"></h2>
  <div class="chat" id="chat"></div>
  <div class="row" style="margin:0 0 10px"><input id="chatIn" data-ph="chatPh" style="flex:1;min-width:200px"><button id="chatSend" data-i="send"></button></div>
  <div class="chips" id="chips"></div>
</section>
</div>

<div id="view-future" class="view hidden">
<section class="card"><div class="reading" id="futureOut"></div></section>
</div>

<div id="view-match" class="view hidden">
<section class="card">
  <h2 data-i="navMatch"></h2>
  <h3 data-i="boy"></h3>
  <div class="grid">
    <div><label data-i="fullName"></label><input id="b_name" data-ph="namePh"></div>
    <div><label data-i="dob"></label><input id="b_dob" type="date" value="1994-03-10"></div>
    <div><label data-i="tob"></label><div class="tsel"><select id="b_hh" data-v="8"></select><select id="b_mm" data-v="15"></select><select id="b_ap" data-v="AM"></select></div></div>
    <div><label data-i="pob"></label><select id="b_city" data-v="0"></select></div>
  </div>
  <h3 style="margin-top:18px" data-i="girl"></h3>
  <div class="grid">
    <div><label data-i="fullName"></label><input id="g_name" data-ph="namePh"></div>
    <div><label data-i="dob"></label><input id="g_dob" type="date" value="1996-08-15"></div>
    <div><label data-i="tob"></label><div class="tsel"><select id="g_hh" data-v="6"></select><select id="g_mm" data-v="45"></select><select id="g_ap" data-v="PM"></select></div></div>
    <div><label data-i="pob"></label><select id="g_city" data-v="4"></select></div>
  </div>
  <div class="row"><button id="matchBtn" data-i="matchBtn"></button></div>
</section>
<section class="card hidden" id="matchCard"><h2 data-i="matchTitle"></h2><div class="reading" id="matchOut"></div></section>
</div>

<div id="view-daily" class="view hidden">
<section class="card"><h2 data-i="todayTitle"></h2><div class="kv" id="panchang"></div></section>
<section class="card"><h2 data-i="chooseRashi"></h2><p class="tag" style="text-align:left;margin:0 0 12px" data-i="rashiHint"></p><div class="rgrid" id="rgrid"></div><div class="reading" id="rashifal"></div></section>
</div>

<section class="card owner">
  <img src="icons/owner.jpg" alt="Pallavi Gupta" width="96" height="96">
  <div><div class="sub" data-i="ownerTitle"></div><div class="oname" data-i="ownerName"></div><div class="tag" style="margin:2px 0 0" data-i="ownerRole"></div></div>
</section>
<div class="modal hidden" id="installModal"><div class="im-body"></div></div>
<p class="note"><span data-i="disclaimer"></span><br><a href="privacy.html" style="color:#a59fc7">Privacy Policy / गोपनीयता नीति</a></p>
</main>

function ascendant(jd,lat,lon){const T=(jd-2451545)/36525;

function buildKundli(inp){
  const [Y,M,D]=inp.dob.split("-").map(Number), [h,mi]=inp.tob.split(":").map(Number);
  const jd=julianDay(Y,M,D,h+mi/60-inp.tz), T=(jd-2451545)/36525;
  const pos=positionsAt(jd), next=positionsAt(jd+1);
  const asc=norm(ascendant(jd,inp.lat,inp.lon)-ayanamsa(T)), lagna=Math.floor(asc/30);
  const planets={};
  for(const p of ["Sun","Moon","Mars","Mercury","Jupiter","Venus","Saturn","Rahu","Ketu"]){
    const Lp=pos[p], s=Math.floor(Lp/30), n=Math.floor(Lp/(360/27));
    let diff=norm(next[p]-Lp); if(diff>180) diff-=360;
    planets[p]={lon:Lp,sign:s,deg:Lp%30,nak:n,pada:Math.floor((Lp%(360/27))/(360/108))+1,house:((s-lagna+12)%12)+1,retro:(p==="Rahu"||p==="Ketu")?true:diff<0};
  }
  return {inp,jd,jdLocal:julianDay(Y,M,D,12),asc,lagna,planets,dasha:vimshottari(pos.Moon,jd)};
}

function vimshottari(moon,jd){
  const span=360/27, n=Math.floor(moon/span), frac=(moon%span)/span, idx=n%9;
  const YR=365.25; let start=jd-frac*DYEARS[DLORDS[idx]]*YR; const list=[];
  for(let k=0;k<9;k++){const l=DLORDS[(idx+k)%9], len=DYEARS[l]*YR; list.push({lord:l,start,end:start+len}); start+=len;}
  return list;
}

 hi:[["वर्ण","कार्य और अहं"],["वश्य","आपसी आकर्षण"],["तारा","स्वास्थ्य और भाग्य"],["योनि","शारीरिक अनुकूलता"],["ग्रह मैत्री","मानसिक मेल और मित्रता"],["गण","स्वभाव"],["भकूट","परिवार का सुख और धन"],["नाड़ी","स्वास्थ्य और संतान"]]};
function gunaMilan(B,G){
  const b=B.planets.Moon,g=G.planets.Moon, out=[];
  out.push({max:1,got:VARNA[b.sign]>=VARNA[g.sign]?1:0,bv:VARNA_N[LANG][VARNA[b.sign]],gv:VARNA_N[LANG][VARNA[g.sign]]});
  const vb=vashyaOf(b),vg=vashyaOf(g); out.push({max:2,got:VASHYA_T[vb][vg],bv:VASHYA_N[LANG][vb],gv:VASHYA_N[LANG][vg]});
  const tg=c=>![3,5,7].includes(c%9); const c1=((b.nak-g.nak+27)%27)+1, c2=((g.nak-b.nak+27)%27)+1;
  out.push({max:3,got:(tg(c1)?1.5:0)+(tg(c2)?1.5:0),bv:NAK[LANG][b.nak],gv:NAK[LANG][g.nak]});
  const yb=YONI_OF[b.nak],yg=YONI_OF[g.nak], enemy=YONI_ENEMY.some(([x,y])=>(x===yb&&y===yg)||(x===yg&&y===yb));
  out.push({max:4,got:yb===yg?4:enemy?0:2,bv:YONI_N[LANG][yb],gv:YONI_N[LANG][yg]});
  const lb=LORD[b.sign],lg=LORD[g.sign]; let gm; if(lb===lg) gm=5; else {const k=[rel(lb,lg),rel(lg,lb)].sort().join(""); gm={FF:5,FN:4,NN:3,EF:1,EN:0.5,EE:0}[k];}
  out.push({max:5,got:gm,bv:pn(lb),gv:pn(lg)});
  const gb=GANA_OF[b.nak],gg=GANA_OF[g.nak]; out.push({max:6,got:GANA_T[gb][gg],bv:GANA_N[LANG][gb],gv:GANA_N[LANG][gg]});
  const bc=((b.sign-g.sign+12)%12)+1; out.push({max:7,got:[2,12,5,9,6,8].includes(bc)?0:7,bv:sn(b.sign),gv:sn(g.sign)});
  const nb=nadiOf(b.nak),ng=nadiOf(g.nak); out.push({max:8,got:nb===ng?0:8,bv:NADI_N[LANG][nb],gv:NADI_N[LANG][ng]});
  return out;
}

 hi:{1:"आज चंद्रमा आपकी ही राशि में है, इसलिए मन ताज़ा और आत्मविश्वास से भरा रहेगा। निजी काम, लोगों से मिलने और कोई छोटा काम शुरू करने के लिए अच्छा दिन है। ज़्यादा भावुक होने से बचें।",2:"आज अपनी वाणी और खर्च पर ध्यान दें। परिवार के मामलों पर ध्यान देना पड़ सकता है और खर्च बढ़ सकते हैं। नरमी से बोलें और किसी को उधार न दें।",3:"आपका साहस और ऊर्जा ऊँचे रहेंगे। मेहनत से सफलता मिलेगी, खासकर बातचीत, छोटी यात्राओं और भाई-बहनों से जुड़े कामों में। पहल करने के लिए अच्छा दिन है।",4:"घर के मामलों को लेकर बेचैनी या चिंता हो सकती है। परिवार में बहस से बचें, माता के साथ समय बिताएँ और पूरा आराम करें।",5:"आज मन निर्णय लेने में उलझ सकता है। जोखिम वाले निवेश और सट्टे से बचें। संतान या पढ़ाई पर ध्यान देना पड़ सकता है — सोच-समझकर निर्णय लें।",6:"विजय का दिन है। रुके हुए काम पूरे होंगे, विरोधी शांत रहेंगे और स्वास्थ्य सुधरेगा। कर्ज़ चुकाने और विवाद सुलझाने के लिए अच्छा समय है।",7:"साझेदारी, जीवनसाथी और मुलाकातों के लिए अच्छा दिन है। व्यापार की बातचीत और यात्रा फलदायी हो सकती है, रिश्तों में मधुरता रहेगी।",8:"आज सावधान रहें: अचानक बाधा या देरी हो सकती है। वाहन ध्यान से चलाएँ, स्वास्थ्य का ध्यान रखें और बड़े निर्णय टाल दें।",9:"भाग्य थोड़ा मिला-जुला रहेगा और कुछ काम में देरी हो सकती है। पूजा-पाठ, आध्यात्मिक कार्य और बड़ों का सम्मान शांति देगा।",10:"करियर के लिए मज़बूत दिन है। आपके काम की सराहना होगी और वरिष्ठ साथ देंगे। काम पर अपने विचार रखने या कुछ माँगने का अच्छा समय है।",11:"लाभ का दिन है। इच्छाएँ पूरी हो सकती हैं, मित्र मदद करेंगे और धन आ सकता है। मेल-जोल और सामाजिक योजनाओं के लिए अच्छा समय है।",12:"खर्च और थकान हो सकती है। आराम करें, उधार देने से बचें और ज़्यादा ज़िम्मेदारियाँ न लें। ध्यान और योजना बनाने के लिए अच्छा दिन है।"}};
const RT={en:{moonIn:"Moon today",luckyColor:"Lucky colour",luckyNum:"Lucky number",upay:"Today's remedy",rating:"Today's rating",ss:"Shani's Sade Sati is running for this Rashi — stay patient and avoid shortcuts.",dh:"Shani's Dhaiya is running for this Rashi — be careful with health and big decisions.",yours:"Your Rashi",chant:(m,p)=>`Chant <span class="mantra">${m}</span> 108 times today (${p}'s day).`},
 hi:{moonIn:"आज चंद्रमा",luckyColor:"शुभ रंग",luckyNum:"शुभ अंक",upay:"आज का उपाय",rating:"आज का दिन",ss:"इस राशि पर शनि की साढ़ेसाती चल रही है — धैर्य रखें और शॉर्टकट से बचें।",dh:"इस राशि पर शनि की ढैय्या चल रही है — स्वास्थ्य और बड़े निर्णयों में सावधानी रखें।",yours:"आपकी राशि",chant:(m,p)=>`आज ${p} का दिन है — <span class="mantra">${m}</span> का 108 बार जाप करें।`}};
let selRashi=null;
try{const r=localStorage.getItem("krishan_rashi"); if(r!==null) selRashi=+r;}catch(e){}
function todayData(){const jd=julianDayNow(), P=positionsAt(jd), d=new Date();
  const diff=norm(P.Moon-P.Sun), t=Math.floor(diff/12), paksha=t<15?0:1, ti=t===14?14:t===29?15:t%15;
  return {P,dow:d.getDay(),moonSign:Math.floor(P.Moon/30),moonNak:Math.floor(P.Moon/(360/27)),tithi:ti,paksha,jup:Math.floor(P.Jupiter/30),sat:Math.floor(P.Saturn/30)};}
function renderRashifal(){
  const U=L(), X=RT[LANG], T=todayData();
  const dateStr=new Date().toLocaleDateString(LANG==="hi"?"hi-IN":"en-IN",{day:"numeric",month:"long",year:"numeric"});
  document.getElementById("panchang").innerHTML=[[U.dateL,dateStr],[U.vaar,DAYS[LANG][T.dow]],[U.tithiL,`${TITHI[LANG][T.tithi]}`],[U.pakshaL,PAKSHA[LANG][T.paksha]],[X.moonIn,`${sn(T.moonSign)} · ${NAK[LANG][T.moonNak]}`]].map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join("");
  if(selRashi===null&&K) selRashi=K.planets.Moon.sign;
  if(selRashi===null) selRashi=0;
  const my=K?K.planets.Moon.sign:null;
  document.getElementById("rgrid").innerHTML=SIGNS.en.map((_,i)=>`<button class="rbtn ${i===selRashi?"on":""}" data-r="${i}"><span class="sym">${SIGN_SYM[i]}</span>${sn(i)}${i===my?`<span class="you">${X.yours}</span>`:""}</button>`).join("");
  document.querySelectorAll(".rbtn").forEach(b=>b.onclick=()=>{selRashi=+b.dataset.r;try{localStorage.setItem("krishan_rashi",selRashi)}catch(e){}renderRashifal();});
  const r=selRashi, house=((T.moonSign-r+12)%12)+1, good=GOOD_MOON.includes(house);
  const jh=((T.jup-r+12)%12)+1, sh=((T.sat-r+12)%12)+1;
  let stars=good?4:2; if([2,5,7,9,11].includes(jh)) stars++; stars=Math.max(1,Math.min(5,stars));
  const dl=DAY_LORD[T.dow];
  let h=`<h3><span class="sym">${SIGN_SYM[r]}</span> ${sn(r)} — ${dateStr}</h3><p><span class="stars">${"★".repeat(stars)}${"☆".repeat(5-stars)}</span> <span class="sub">${X.rating}</span></p><p>${RF[LANG][house]}</p>`;
  if([12,1,2].includes(sh)) h+=`<p class="sub">⚠ ${X.ss}</p>`; else if([4,8].includes(sh)) h+=`<p class="sub">⚠ ${X.dh}</p>`;
  h+=`<div class="kv" style="margin-top:12px"><div><small>${X.luckyColor}</small><b>${COLORS[LANG][T.dow]}</b></div><div><small>${X.luckyNum}</small><b>${LUCKY_NUM[LORD[r]]}</b></div></div>`;
  h+=`<h3>${X.upay}</h3><p>${X.chant(MANTRA[dl][0],pn(dl))} ${REMEDY[LANG][dl]}</p>`;
  document.getElementById("rashifal").innerHTML=h;
}

// ================= Views =================
let VIEW="home";
function showView(v,noHash){VIEW=v;
  document.querySelectorAll(".view").forEach(el=>el.classList.toggle("hidden",el.id!=="view-"+(v==="dosh"?"home":v)));
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.view===v));
  if(!noHash){try{history.replaceState(null,"","#"+v)}catch(e){location.hash=v}}
  if(v==="daily") renderRashifal();
  if(v==="ask") renderChat();
  if(v==="future"&&window.renderFuture) renderFuture();
  if(v==="dosh"&&K&&document.getElementById("result").classList.contains("hidden")){render(K);document.getElementById("formCard").classList.add("hidden");document.getElementById("result").classList.remove("hidden");}
  if(v==="dosh"){ if(K){document.getElementById("doshCard").scrollIntoView({behavior:"smooth"});} else {document.getElementById("doshNeed").classList.remove("hidden"); document.getElementById("formCard").scrollIntoView({behavior:"smooth"});} }
  else document.getElementById("doshNeed").classList.add("hidden");
  if(v!=="dosh") window.scrollTo(0,0);
}

// ================= Render =================
function drawChart(k){
  const pos={1:[200,100],2:[100,45],3:[45,100],4:[100,200],5:[45,300],6:[100,355],7:[200,300],8:[300,355],9:[355,300],10:[300,200],11:[355,100],12:[300,45]};
  const num={1:[200,175],2:[100,85],3:[85,100],4:[175,200],5:[85,300],6:[100,315],7:[200,225],8:[300,315],9:[315,300],10:[225,200],11:[315,100],12:[300,85]};
  const AB=ABBR[LANG], rmark=LANG==="hi"?"(व)":"ᴿ";
  let s=`<rect x="2" y="2" width="396" height="396" rx="6" fill="#120d2c" stroke="#e8b94a" stroke-width="2"/>
  <g stroke="#e8b94a" stroke-width="1.4" fill="none"><line x1="2" y1="2" x2="398" y2="398"/><line x1="398" y1="2" x2="2" y2="398"/><polygon points="200,2 398,200 200,398 2,200"/></g>`;
  for(let h=1;h<=12;h++){const sg=(k.lagna+h-1)%12+1; s+=`<text x="${num[h][0]}" y="${num[h][1]}" fill="#a59fc7" font-size="12" text-anchor="middle" dominant-baseline="middle">${sg}</text>`;
    const items=(h===1?[AB.Lagna]:[]).concat(planetsIn(k,h).map(p=>AB[p]+(k.planets[p].retro&&p!=="Rahu"&&p!=="Ketu"?rmark:"")));
    items.forEach((t,i)=>{const cols=items.length>1?2:1, row=Math.floor(i/2), col=i%2;
      const x=pos[h][0]+(cols===2?(col?17:-17):0), y=pos[h][1]+(row-(Math.ceil(items.length/2)-1)/2)*17;
      s+=`<text x="${x}" y="${y}" fill="${t===AB.Lagna?"#f6d98b":"#ece8fb"}" font-size="${LANG==="hi"?13:14}" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="Noto Sans Devanagari, Inter, sans-serif">${t}</text>`});}
  document.getElementById("chart").innerHTML=s;
}
function render(k){
  const P=k.planets, md=currentMD(k), U=L(), now=julianDayNow();
  document.getElementById("hello").textContent=U.kundliOf(k.inp.name);
  const sub=i=>LANG==="en"?` <span class="sub">${RASHI[i]}</span>`:"";
  document.getElementById("summary").innerHTML=[[U.born,`${fmt(k.jdLocal)}, ${k.inp.timeLabel}`],[U.lagna,`${sn(k.lagna)}${sub(k.lagna)} ${dms(k.asc%30)}`],[U.moonSign,`${sn(P.Moon.sign)}${sub(P.Moon.sign)}`],[U.nakshatra,`${NAK[LANG][P.Moon.nak]} – ${U.pada} ${P.Moon.pada}`],[U.sunSign,sn(P.Sun.sign)],[U.runningMD,pn(md.lord)]].map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join("");
  drawChart(k);
  document.getElementById("ptable").innerHTML=`<tr><th>${U.thPlanet}</th><th>${U.thSign}</th><th>${U.thDeg}</th><th>${U.thNak}</th><th>${U.thHouse}</th></tr>`+
    Object.keys(P).map(p=>{const x=P[p],dg=dignityKey(p,x.sign);return `<tr><td>${pn(p)}${LANG==="en"?` <span class="sub">${HINDI_ROMAN[p]}</span>`:""}${x.retro&&p!=="Rahu"&&p!=="Ketu"?` <span class='pill'>${U.retro}</span>`:""}</td><td>${sn(x.sign)}${dg?` <span class="pill ${dg==="Debilitated"?"b":"g"}">${DIGN[LANG][dg]}</span>`:""}</td><td>${dms(x.deg)}</td><td>${NAK[LANG][x.nak]} ${x.pada}</td><td>${x.house}</td></tr>`}).join("");
  document.getElementById("dtable").innerHTML=`<tr><th>${U.thMD}</th><th>${U.thFrom}</th><th>${U.thTo}</th></tr>`+k.dasha.map(d=>`<tr class="${now>=d.start&&now<d.end?"dasha-now":""}"><td>${pn(d.lord)}</td><td>${fmt(Math.max(d.start,k.jd))}</td><td>${fmt(d.end)}</td></tr>`).join("");
  document.getElementById("atable").innerHTML=`<tr><th>${U.antarOf(pn(md.lord))}</th><th>${U.thFrom}</th><th>${U.thTo}</th></tr>`+antardashas(md).map(a=>`<tr class="${now>=a.start&&now<a.end?"dasha-now":""}"><td>${pn(md.lord)} / ${pn(a.lord)}</td><td>${fmt(a.start)}</td><td>${fmt(a.end)}</td></tr>`).join("");
  document.getElementById("dosh").innerHTML=doshHtml(k);
  const tabs=document.getElementById("tabs"); tabs.innerHTML=Object.entries(AREAS).map(([key,a])=>`<button class="tab" data-k="${key}">${a.t[LANG]}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showArea(b.dataset.k,""));
  showArea(currentArea);
}
let K=null, currentArea="career";
let currentQ="";
function showArea(key,q){currentArea=key;if(q!==undefined)currentQ=q;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.k===key));document.getElementById("reading").innerHTML=(window.Engine&&Engine.ready)?Engine.areaAnswer(K,key,currentQ,"yog"):reading(K,key,currentQ);}
function matchArea(q,fallback){q=(q||"").toLowerCase();let best=fallback,bs=0;for(const [key,a] of Object.entries(AREAS)){const sc=a.kw.filter(w=>kwHit(q,w)).length;if(sc>bs){bs=sc;best=key}}return best;}

  const U=L();
  document.documentElement.lang=LANG; document.body.classList.toggle("hi",LANG==="hi");
  document.title=LANG==="hi"?"कृष्ण ज्योतिषी – Krishan Astrologer":"Krishan Astrologer";
  document.querySelectorAll("[data-i]").forEach(el=>el.innerHTML=U[el.dataset.i]);
  document.querySelectorAll("[data-ph]").forEach(el=>el.placeholder=U[el.dataset.ph]);
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===LANG));
  const cv=sel.value, gv=gsel.selectedIndex;
  sel.innerHTML=CITIES.map((c,i)=>`<option value="${i}">${LANG==="hi"?c[1]:c[0]}</option>`).join("")+`<option value="custom">${U.otherPlace}</option>`;
  if(cv) sel.value=cv;
  gsel.innerHTML=U.genders.map(g=>`<option>${g}</option>`).join(""); gsel.selectedIndex=Math.max(0,gv);
  const hh=document.getElementById("hh"),mm=document.getElementById("mm"),ap=document.getElementById("ap"),ps=document.getElementById("probSel");

  ap.innerHTML=`<option value="AM">${U.am}</option><option value="PM">${U.pm}</option>`;
  hh.value=hv;mm.value=mv;ap.value=av;
  ps.innerHTML=Object.entries(AREAS).map(([key,a])=>`<option value="${key}">${a.p[LANG]}</option>`).join("");ps.value=pv;
  ["b_","g_"].forEach(pre=>{
    const c=document.getElementById(pre+"city"),h=document.getElementById(pre+"hh"),m=document.getElementById(pre+"mm"),a=document.getElementById(pre+"ap");
    const cv=c.value||c.dataset.v,hv=h.value||h.dataset.v,mv=m.value||m.dataset.v,av=a.value||a.dataset.v;
    c.innerHTML=CITIES.map((x,i)=>`<option value="${i}">${LANG==="hi"?x[1]:x[0]}</option>`).join("");
    h.innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join("");
    m.innerHTML=Array.from({length:60},(_,i)=>`<option value="${i}">${String(i).padStart(2,"0")}</option>`).join("");
    a.innerHTML=`<option value="AM">${U.am}</option><option value="PM">${U.pm}</option>`;
    c.value=cv;h.value=hv;m.value=mv;a.value=av;});
  if(K) render(K);
  if(lastMatch) renderMatch();
  if(VIEW==="daily") renderRashifal();
  if(VIEW==="ask") renderChat();
  if(VIEW==="future"&&window.renderFuture) renderFuture();
}
