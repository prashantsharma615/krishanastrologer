<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krishan Astrologer</title>
<meta name="description" content="Krishan Astrologer – Vedic Kundli, Dasha and astrology guidance in Hindi and English.">
<meta name="theme-color" content="#0f0b24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0b24;--card:#1a1438;--card2:#231b4a;--gold:#e8b94a;--gold2:#f6d98b;--txt:#ece8fb;--mut:#a59fc7;--line:#3a3070;--good:#7fd8a6;--bad:#f2908b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans Devanagari",system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -200px,#2c1f6b 0%,var(--bg) 60%);color:var(--txt);min-height:100vh}
body.hi{font-family:"Noto Sans Devanagari",Inter,system-ui,sans-serif}
header{text-align:center;padding:22px 16px 8px;position:relative}
.lang{display:inline-flex;border:1px solid var(--gold);border-radius:999px;overflow:hidden;margin-bottom:14px}
.lang button{background:transparent;color:var(--gold2);border:0;border-radius:0;padding:7px 16px;font-size:14px;font-weight:600}
.lang button.on{background:var(--gold);color:#1b1230}
.logo{font-family:Cinzel,"Noto Sans Devanagari",serif;font-size:30px;letter-spacing:2px;color:var(--gold)}
body.hi .logo{letter-spacing:0}
.logo span{color:var(--txt)}
.tag{color:var(--mut);font-size:14px;margin-top:4px}
main{max-width:980px;margin:0 auto;padding:12px 16px 60px}
.card{background:linear-gradient(180deg,var(--card),#150f30);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0}
h2{font-family:Cinzel,"Noto Sans Devanagari",serif;color:var(--gold2);font-size:19px;margin:0 0 14px;letter-spacing:.5px}
h3{color:var(--gold2);font-size:15px;margin:16px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}
input,select,textarea{width:100%;background:#0e0a22;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px;font:inherit;font-size:15px}
input:focus,select:focus{outline:none;border-color:var(--gold)}
button{background:linear-gradient(180deg,#f2c75c,#d49b25);color:#1b1230;border:0;border-radius:10px;padding:12px 22px;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}
button.ghost{background:transparent;color:var(--gold2);border:1px solid var(--gold)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.hidden{display:none}
.two{display:grid;grid-template-columns:minmax(280px,400px) 1fr;gap:20px;align-items:start}
@media(max-width:760px){.two{grid-template-columns:1fr}}
svg.chart{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--card2);border:1px solid var(--line);margin:2px 4px 2px 0}
.pill.g{color:var(--good);border-color:#2f6b4c}.pill.b{color:var(--bad);border-color:#7a3a37}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--card2);color:var(--txt);border:1px solid var(--line);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:500}
.tab.on{background:var(--gold);color:#1b1230;border-color:var(--gold)}
.reading p{line-height:1.7;margin:8px 0;color:#ddd8f3}
.reading ul{margin:6px 0 6px 18px;line-height:1.65;color:#ddd8f3}
.kv{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.kv div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:130px}
.kv b{display:block;color:var(--gold2);font-size:16px;margin-top:2px}
.kv small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.sub{color:var(--mut);font-size:12px}
.note{font-size:12px;color:var(--mut);line-height:1.6;text-align:center;margin-top:24px}
.dasha-now{background:#2a1f57}
.tsel{display:flex;gap:6px}.tsel select{padding:11px 6px}
.qbox{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px}
.step{display:flex;gap:10px;align-items:baseline}.step .n{background:var(--gold);color:#1b1230;border-radius:999px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.mantra{color:var(--gold2);font-weight:600}
</style>
</head>

  <div class="logo" data-i="logo"></div>
  <div class="tag" data-i="tagline"></div>
</header>

    <div><label data-i="lon"></label><input id="lon" type="number" step="0.0001" value="74.8570"></div>
    <div><label data-i="tz"></label><input id="tz" type="number" step="0.25" value="5.5"></div>
  </div>
  <h2 style="margin-top:24px" data-i="probHead"></h2>
  <div><label data-i="chooseProb"></label><select id="probSel"></select></div>
  <div style="margin-top:12px"><label data-i="describe"></label><input id="probTxt" data-ph="askPh"></div>
  <div class="row"><button id="go" data-i="generate"></button><span class="tag" style="margin:0" data-i="exactTime"></span></div>
</section>

<div id="result" class="hidden">
  <section class="card">
    <h2 data-i="solve"></h2>
    <div class="reading" id="reading"></div>
    <h3 style="margin-top:22px" data-i="another"></h3>
    <div class="tabs" id="tabs"></div>
    <div class="row" style="margin-top:0;margin-bottom:4px">
      <input id="ask" data-ph="askPh" style="flex:1;min-width:220px">
      <button class="ghost" id="askBtn" data-i="getGuidance"></button>
    </div>
  </section>

  <section class="card">
    <h2 id="hello"></h2>
    <div class="kv" id="summary"></div>
    <div class="two" style="margin-top:14px">
      <div><svg class="chart" id="chart" viewBox="0 0 400 400"></svg><div class="tag" style="text-align:center" data-i="chartCap"></div></div>
      <div><table id="ptable"></table></div>
    </div>
  </section>

  <section class="card">
    <h2 data-i="dashaTitle"></h2>
    <p class="tag" style="text-align:left;margin:0 0 10px" data-i="dashaDesc"></p>
    <table id="dtable"></table>
    <h3 data-i="antarTitle"></h3>
    <table id="atable"></table>
  </section>

  <div class="row" style="justify-content:center"><button class="ghost" id="again" data-i="newKundli"></button></div>
</div>

<p class="note"><span data-i="disclaimer"></span><br><a href="privacy.html" style="color:#a59fc7">Privacy Policy / गोपनीयता नीति</a></p>
</main>

  foreign:["जिस देश जाना है उसकी आधिकारिक इमिग्रेशन वेबसाइट पर सही पात्रता जाँचें।","दस्तावेज़, भाषा परीक्षा और पैसों की तैयारी पहले से करें।","केवल पंजीकृत और जाँचे-परखे एजेंट से ही काम कराएँ।"],
  children:["किसी भी चिकित्सीय चिंता के लिए योग्य डॉक्टर से सलाह लें।","बच्चों के साथ रोज़ अच्छा समय बिताएँ और उनका उत्साह बढ़ाएँ।","घर का माहौल शांत और सकारात्मक रखें।"],
  property:["कोई भी सौदा करने से पहले वकील से सभी कागज़ात और मालिकाना हक़ जाँचें।","बजट तय करें और ज़रूरत से ज़्यादा कर्ज़ न लें।","दबाव में न खरीदें; कम से कम 3 विकल्पों की तुलना करें।"]}};
const TXT={
 en:{house:(h,mean,sign,lord,lh,lmean,dg)=>`<b>House ${h} (${mean})</b> falls in <b>${sign}</b>, ruled by <b>${lord}</b>, which sits in your house ${lh} (${lmean})${dg?`, <b>${dg.toLowerCase()}</b>`:""}. `,
  strong:"This is a strong placement: results here come with relatively less struggle. ",weak:"This placement is the main reason for delays or obstacles here; it asks for extra effort and patience. ",balanced:"This is a balanced placement: steady effort brings steady results. ",
  here:l=>`Planets here: ${l}. `,ben:(p,n)=>`${p} brings ${n}. `,mal:(p,n)=>`${p} adds ${n}, which can create pressure or delay. `,
  q:"Your question",why:"Why this is happening (your chart)",when:"When things will improve (dasha timing)",rem:"Remedies (Upay)",steps:"Practical steps",
  running:(md,d,ad,d2)=>`You are running <b>${md} Mahadasha</b> (until ${d})${ad?` with <b>${ad} Antardasha</b> (until ${d2})`:""}. `,
  active:(p,area,d)=>`${p} is directly connected to ${area.toLowerCase()} in your chart, so <b>this is an active period until ${d}</b>. Matters here are likely to move — take initiative now.`,
  next:(p1,p2,d1,d2)=>`The current period is not directly tied to this area. <b>A better period comes from ${d1} to ${d2}</b> (${p1} / ${p2}). Prepare until then so you can use it fully.`,
  none:"The coming dasha periods are not strongly tied to this area, so results will come mainly through steady effort and the practical steps below.",
  mantra:(m,day)=>`Chant <span class="mantra">${m}</span> 108 times, especially on ${day}.`,
  overall:"Outlook",fav:"Favourable",eff:"Needs effort",mix:"Mixed"},
 hi:{house:(h,mean,sign,lord,lh,lmean,dg)=>`<b>भाव ${h} (${mean})</b> में <b>${sign}</b> राशि है, जिसका स्वामी <b>${lord}</b> आपके ${lh}वें भाव (${lmean}) में${dg?` <b>${dg}</b> अवस्था में`:""} स्थित है। `,
  strong:"यह एक मज़बूत स्थिति है: यहाँ परिणाम अपेक्षाकृत कम संघर्ष से मिलते हैं। ",weak:"यही स्थिति इस क्षेत्र में देरी या बाधा का मुख्य कारण है; इसके लिए अतिरिक्त प्रयास और धैर्य चाहिए। ",balanced:"यह संतुलित स्थिति है: लगातार प्रयास से लगातार परिणाम मिलते हैं। ",
  here:l=>`यहाँ स्थित ग्रह: ${l}। `,ben:(p,n)=>`${p} ${n} प्रदान करता है। `,mal:(p,n)=>`${p} ${n} का प्रभाव देता है, जिससे दबाव या देरी हो सकती है। `,
  q:"आपका प्रश्न",why:"ऐसा क्यों हो रहा है (आपकी कुंडली)",when:"कब सुधार होगा (दशा का समय)",rem:"उपाय",steps:"व्यावहारिक कदम",
  running:(md,d,ad,d2)=>`आपकी <b>${md} महादशा</b> चल रही है (${d} तक)${ad?`, साथ में <b>${ad} अंतर्दशा</b> (${d2} तक)`:""}। `,
  active:(p,area,d)=>`${p} आपकी कुंडली में सीधे ${area} से जुड़ा है, इसलिए <b>${d} तक यह सक्रिय समय है</b>। इस क्षेत्र के मामले आगे बढ़ सकते हैं — अभी पहल करें।`,
  next:(p1,p2,d1,d2)=>`वर्तमान दशा इस क्षेत्र से सीधे नहीं जुड़ी है। <b>${d1} से ${d2} तक बेहतर समय आएगा</b> (${p1} / ${p2})। तब तक तैयारी करें ताकि उस समय का पूरा लाभ ले सकें।`,
  none:"आने वाली दशाएँ इस क्षेत्र से ज़्यादा नहीं जुड़ी हैं, इसलिए परिणाम मुख्य रूप से लगातार प्रयास और नीचे दिए व्यावहारिक कदमों से मिलेंगे।",
  mantra:(m,day)=>`विशेष रूप से ${day} को <span class="mantra">${m}</span> मंत्र का 108 बार जाप करें।`,
  overall:"स्थिति",fav:"अनुकूल",eff:"प्रयास आवश्यक",mix:"मिश्रित"}};

function lordOf(k,h){return LORD[(k.lagna+h-1)%12]}
function planetsIn(k,h){return Object.keys(k.planets).filter(p=>k.planets[p].house===h)}
function currentMD(k){const now=julianDayNow();return k.dasha.find(d=>now>=d.start&&now<d.end)||k.dasha[k.dasha.length-1]}
function strength(p,k){const P=k.planets[p], dg=dignityKey(p,P.sign); let s=0;
  if(dg==="Exalted"||dg==="Own")s+=2; if(dg==="Debilitated")s-=2; if([1,4,5,7,9,10].includes(P.house))s+=1; if([6,8,12].includes(P.house))s-=1; return {s,dg};}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const H3=(n,t)=>`<h3 class="step"><span class="n">${n}</span>${t}</h3>`;
function reading(k,key,q){
  const A=AREAS[key], X=TXT[LANG], now=julianDayNow(), md=currentMD(k), mi=k.dasha.indexOf(md);
  const ads=antardashas(md), ad=ads.find(a=>now>=a.start&&now<a.end);
  const seq=ads.map(a=>({md:md.lord,...a})).concat(mi+1<k.dasha.length?antardashas(k.dasha[mi+1]).map(a=>({md:k.dasha[mi+1].lord,...a})):[]);
  let why="", score=0; const involved=new Set();
  for(const h of A.h){
    const lord=lordOf(k,h), lp=k.planets[lord], st=strength(lord,k), inH=planetsIn(k,h);
    involved.add(lord); inH.forEach(p=>involved.add(p)); score+=st.s;
    why+=`<p>`+X.house(h,HOUSE_MEAN[LANG][h],sn((k.lagna+h-1)%12),pn(lord),lp.house,HOUSE_MEAN[LANG][lp.house],st.dg?DIGN[LANG][st.dg]:"");
    why+= st.s>=2?X.strong: st.s<=-1?X.weak:X.balanced;
    if(inH.length){ why+=X.here(inH.map(p=>`<b>${pn(p)}</b>`).join(", "));
      inH.forEach(p=>{ if(BENEFIC.has(p)){score+=1;why+=X.ben(pn(p),PL_NATURE[LANG][p])} else {score-=0.5;why+=X.mal(pn(p),PL_NATURE[LANG][p])} }); }
    why+=`</p>`;
  }
  let when=`<p>`+X.running(pn(md.lord),fmt(md.end),ad?pn(ad.lord):"",ad?fmt(ad.end):"");
  if(involved.has(md.lord)||(ad&&involved.has(ad.lord))) when+=X.active(pn(involved.has(md.lord)?md.lord:ad.lord),A.t[LANG],fmt(involved.has(md.lord)?md.end:ad.end));
  else { const nxt=seq.find(a=>a.start>now&&(involved.has(a.lord)||involved.has(a.md))); when+= nxt?X.next(pn(nxt.md),pn(nxt.lord),fmt(nxt.start),fmt(nxt.end)):X.none; }
  when+=`</p>`;
  const tone=score>=2?["g",X.fav]:score<=-1?["b",X.eff]:["",X.mix];
  const rem=[...involved].filter(p=>strength(p,k).s<=0).slice(0,2); if(!rem.length) rem.push([...involved][0]);
  if(!rem.includes(md.lord)&&rem.length<3) rem.push(md.lord);
  const remHtml=`<ul>${rem.map(p=>`<li><b>${pn(p)}:</b> ${X.mantra(MANTRA[p][0],MANTRA[p][LANG==="hi"?2:1])} ${REMEDY[LANG][p]}</li>`).join("")}</ul>`;
  const stepsHtml=`<ul>${PRACTICAL[LANG][key].map(t=>`<li>${t}</li>`).join("")}</ul>`;
  return `${q?`<div class="qbox"><b>${X.q}:</b> ${esc(q)}</div>`:""}<div><span class="pill ${tone[0]}">${A.t[LANG]} — ${X.overall}: ${tone[1]}</span></div>`
    +H3(1,X.why)+why+H3(2,X.when)+when+H3(3,X.rem)+remHtml+H3(4,X.steps)+stepsHtml;
}

// ================= Render =================
function drawChart(k){
  const pos={1:[200,100],2:[100,45],3:[45,100],4:[100,200],5:[45,300],6:[100,355],7:[200,300],8:[300,355],9:[355,300],10:[300,200],11:[355,100],12:[300,45]};
  const num={1:[200,175],2:[100,85],3:[85,100],4:[175,200],5:[85,300],6:[100,315],7:[200,225],8:[300,315],9:[315,300],10:[225,200],11:[315,100],12:[300,85]};
  const AB=ABBR[LANG], rmark=LANG==="hi"?"(व)":"ᴿ";
  let s=`<rect x="2" y="2" width="396" height="396" rx="6" fill="#120d2c" stroke="#e8b94a" stroke-width="2"/>
  <g stroke="#e8b94a" stroke-width="1.4" fill="none"><line x1="2" y1="2" x2="398" y2="398"/><line x1="398" y1="2" x2="2" y2="398"/><polygon points="200,2 398,200 200,398 2,200"/></g>`;
  for(let h=1;h<=12;h++){const sg=(k.lagna+h-1)%12+1; s+=`<text x="${num[h][0]}" y="${num[h][1]}" fill="#a59fc7" font-size="12" text-anchor="middle" dominant-baseline="middle">${sg}</text>`;
    const items=(h===1?[AB.Lagna]:[]).concat(planetsIn(k,h).map(p=>AB[p]+(k.planets[p].retro&&p!=="Rahu"&&p!=="Ketu"?rmark:"")));
    items.forEach((t,i)=>{const cols=items.length>1?2:1, row=Math.floor(i/2), col=i%2;
      const x=pos[h][0]+(cols===2?(col?17:-17):0), y=pos[h][1]+(row-(Math.ceil(items.length/2)-1)/2)*17;
      s+=`<text x="${x}" y="${y}" fill="${t===AB.Lagna?"#f6d98b":"#ece8fb"}" font-size="${LANG==="hi"?13:14}" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="Noto Sans Devanagari, Inter, sans-serif">${t}</text>`});}
  document.getElementById("chart").innerHTML=s;
}
function render(k){
  const P=k.planets, md=currentMD(k), U=L(), now=julianDayNow();
  document.getElementById("hello").textContent=U.kundliOf(k.inp.name);
  const sub=i=>LANG==="en"?` <span class="sub">${RASHI[i]}</span>`:"";
  document.getElementById("summary").innerHTML=[[U.born,`${fmt(k.jdLocal)}, ${k.inp.timeLabel}`],[U.lagna,`${sn(k.lagna)}${sub(k.lagna)} ${dms(k.asc%30)}`],[U.moonSign,`${sn(P.Moon.sign)}${sub(P.Moon.sign)}`],[U.nakshatra,`${NAK[LANG][P.Moon.nak]} – ${U.pada} ${P.Moon.pada}`],[U.sunSign,sn(P.Sun.sign)],[U.runningMD,pn(md.lord)]].map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join("");
  drawChart(k);
  document.getElementById("ptable").innerHTML=`<tr><th>${U.thPlanet}</th><th>${U.thSign}</th><th>${U.thDeg}</th><th>${U.thNak}</th><th>${U.thHouse}</th></tr>`+
    Object.keys(P).map(p=>{const x=P[p],dg=dignityKey(p,x.sign);return `<tr><td>${pn(p)}${LANG==="en"?` <span class="sub">${HINDI_ROMAN[p]}</span>`:""}${x.retro&&p!=="Rahu"&&p!=="Ketu"?` <span class='pill'>${U.retro}</span>`:""}</td><td>${sn(x.sign)}${dg?` <span class="pill ${dg==="Debilitated"?"b":"g"}">${DIGN[LANG][dg]}</span>`:""}</td><td>${dms(x.deg)}</td><td>${NAK[LANG][x.nak]} ${x.pada}</td><td>${x.house}</td></tr>`}).join("");
  document.getElementById("dtable").innerHTML=`<tr><th>${U.thMD}</th><th>${U.thFrom}</th><th>${U.thTo}</th></tr>`+k.dasha.map(d=>`<tr class="${now>=d.start&&now<d.end?"dasha-now":""}"><td>${pn(d.lord)}</td><td>${fmt(Math.max(d.start,k.jd))}</td><td>${fmt(d.end)}</td></tr>`).join("");
  document.getElementById("atable").innerHTML=`<tr><th>${U.antarOf(pn(md.lord))}</th><th>${U.thFrom}</th><th>${U.thTo}</th></tr>`+antardashas(md).map(a=>`<tr class="${now>=a.start&&now<a.end?"dasha-now":""}"><td>${pn(md.lord)} / ${pn(a.lord)}</td><td>${fmt(a.start)}</td><td>${fmt(a.end)}</td></tr>`).join("");
  const tabs=document.getElementById("tabs"); tabs.innerHTML=Object.entries(AREAS).map(([key,a])=>`<button class="tab" data-k="${key}">${a.t[LANG]}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showArea(b.dataset.k,""));
  showArea(currentArea);
}
let K=null, currentArea="career";
let currentQ="";
function showArea(key,q){currentArea=key;if(q!==undefined)currentQ=q;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.k===key));document.getElementById("reading").innerHTML=reading(K,key,currentQ);}
function matchArea(q,fallback){q=(q||"").toLowerCase();let best=fallback,bs=0;for(const [key,a] of Object.entries(AREAS)){const sc=a.kw.filter(w=>q.includes(w)).length;if(sc>bs){bs=sc;best=key}}return best;}

const sel=document.getElementById("city"), gsel=document.getElementById("gender");
function applyLang(){
  const U=L();
  document.documentElement.lang=LANG; document.body.classList.toggle("hi",LANG==="hi");
  document.title=LANG==="hi"?"कृष्ण ज्योतिषी – Krishan Astrologer":"Krishan Astrologer";
  document.querySelectorAll("[data-i]").forEach(el=>el.innerHTML=U[el.dataset.i]);
  document.querySelectorAll("[data-ph]").forEach(el=>el.placeholder=U[el.dataset.ph]);
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===LANG));
  const cv=sel.value, gv=gsel.selectedIndex;
  sel.innerHTML=CITIES.map((c,i)=>`<option value="${i}">${LANG==="hi"?c[1]:c[0]}</option>`).join("")+`<option value="custom">${U.otherPlace}</option>`;
  if(cv) sel.value=cv;
  gsel.innerHTML=U.genders.map(g=>`<option>${g}</option>`).join(""); gsel.selectedIndex=Math.max(0,gv);
  const hh=document.getElementById("hh"),mm=document.getElementById("mm"),ap=document.getElementById("ap"),ps=document.getElementById("probSel");
  const hv=hh.value||"10",mv=mm.value||"30",av=ap.value||"AM",pv=ps.value||"career";
  hh.innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join("");
  mm.innerHTML=Array.from({length:60},(_,i)=>`<option value="${i}">${String(i).padStart(2,"0")}</option>`).join("");
  ap.innerHTML=`<option value="AM">${U.am}</option><option value="PM">${U.pm}</option>`;
  hh.value=hv;mm.value=mv;ap.value=av;
  ps.innerHTML=Object.entries(AREAS).map(([key,a])=>`<option value="${key}">${a.p[LANG]}</option>`).join("");ps.value=pv;
  if(K) render(K);
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;try{localStorage.setItem("krishan_lang",LANG)}catch(e){}applyLang();});
sel.onchange=()=>document.getElementById("customBox").classList.toggle("hidden",sel.value!=="custom");
document.getElementById("go").onclick=()=>{
  const c=sel.value==="custom"?null:CITIES[+sel.value];
  const H=+document.getElementById("hh").value, Mi=+document.getElementById("mm").value, AP=document.getElementById("ap").value;
  const h24=(H%12)+(AP==="PM"?12:0);
  const inp={name:document.getElementById("name").value.trim(),dob:document.getElementById("dob").value,tob:h24+":"+Mi,timeLabel:`${H}:${String(Mi).padStart(2,"0")} ${AP}`,
    lat:c?c[2]:+document.getElementById("lat").value,lon:c?c[3]:+document.getElementById("lon").value,tz:c?5.5:+document.getElementById("tz").value};
  if(!inp.dob){document.getElementById("dob").focus();return}
  const qt=document.getElementById("probTxt").value.trim();
  currentArea=matchArea(qt,document.getElementById("probSel").value); currentQ=qt;
  K=buildKundli(inp); render(K);
  document.getElementById("formCard").classList.add("hidden"); document.getElementById("result").classList.remove("hidden"); window.scrollTo(0,0);
};
document.getElementById("again").onclick=()=>{document.getElementById("result").classList.add("hidden");document.getElementById("formCard").classList.remove("hidden")};
document.getElementById("askBtn").onclick=()=>{const raw=document.getElementById("ask").value.trim(); if(!raw) return; showArea(matchArea(raw,currentArea),raw); document.getElementById("result").scrollIntoView({behavior:"smooth"});};
document.getElementById("ask").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("askBtn").click();});
applyLang();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
